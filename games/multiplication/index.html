<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplication Game</title>
<style>
  :root {
    --primary: #c2185b;
    --primary-dark: #880e4f;
    --accent: #7b1fa2;
    --good: #2e7d32;
    --good-bg: #e8f5e9;
    --warn: #d84315;
    --warn-bg: #fbe9e7;
    --ink: #222;
    --muted: #555;
    --rule: #ccc;
    --paper: #fff;
    --bg: #fdf4f8;
    --soft: #fce4ec;
    --focus: #1565c0;
    --radius: 10px;
    --hundreds: #f48fb1;
    --tens: #ce93d8;
    --ones: #f8bbd0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 48px; }
  header.top { border-bottom: 3px solid var(--primary); padding-bottom: 10px; margin-bottom: 14px; }
  .school { letter-spacing: .14em; font-size: .78rem; color: var(--primary); margin: 0; font-weight: bold; }
  h1 { font-family: Georgia, "Times New Roman", serif; color: var(--primary-dark); font-size: 1.7rem; margin: 6px 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; color: var(--primary-dark); }
  .sub { color: var(--muted); margin: 0; }
  .panel {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  fieldset { border: 0; margin: 0; padding: 0; }
  legend { font-weight: bold; color: var(--primary-dark); margin-bottom: 8px; }
  .levels { display: flex; flex-direction: column; gap: 8px; }
  .levels label {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 10px 12px;
  }
  button, input { font: inherit; }
  button {
    min-height: 44px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    cursor: pointer;
  }
  button.ghost { background: #fff; color: var(--primary-dark); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .hud { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); margin-bottom: 8px; }
  .prompt { font-size: 2rem; font-weight: bold; color: var(--primary-dark); margin: 0 0 8px; }
  .answer-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .answer-row label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: .92rem; }
  input[type="text"] {
    width: 8em;
    padding: 8px 10px;
    border: 1px solid #999;
    border-radius: 8px;
    font-size: 1.25rem;
  }
  input.bad { border-color: var(--warn); background: var(--warn-bg); }
  .fb { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; display: none; }
  .fb.show { display: block; }
  .fb.good { background: var(--good-bg); color: #1b5e20; border-left: 4px solid var(--good); }
  .fb.bad { background: var(--warn-bg); color: #8a2a0c; border-left: 4px solid var(--warn); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  svg.model { width: 100%; height: auto; display: block; background: #fff; }
  .scale-note { color: var(--muted); font-size: .92rem; margin: 8px 0 0; }
  ul.parts { margin: 8px 0 0; padding-left: 20px; }
  ul.parts li { margin: 2px 0; }
  ol.review { padding-left: 22px; }
  ol.review li { margin: 6px 0; }
  .mark-ok { color: var(--good); font-weight: bold; }
  .mark-no { color: #8a2a0c; font-weight: bold; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) {
    body { font-size: 16px; }
    h1 { font-size: 1.35rem; }
    .prompt { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <p class="school">NEWTON SCHOOL</p>
    <h1>Multiplication Game</h1>
    <p class="sub">Ten questions. Ten points each. No timer. One scored try for each question.</p>
  </header>

  <section class="panel" id="setup">
    <form id="setupForm">
      <fieldset>
        <legend>Choose a level</legend>
        <div class="levels">
          <label><input type="radio" name="level" value="1" checked> Level 1 — tables 3, 4, 5, 6, 7, 8, and 9, each times a factor from 1 through 9.</label>
          <label><input type="radio" name="level" value="2"> Level 2 — a two-digit number times a one-digit number from 1 through 9.</label>
          <label><input type="radio" name="level" value="3"> Level 3 — a three-digit number times a one-digit number from 1 through 9.</label>
        </div>
      </fieldset>
      <div class="actions">
        <button type="submit" id="startBtn">Start</button>
      </div>
    </form>
  </section>

  <section class="panel" id="play" hidden>
    <div class="hud">
      <span>Question <strong id="qNum">1</strong> of 10</span>
      <span>Score <strong id="score">0</strong> / 100</span>
    </div>
    <p class="prompt" id="prompt">3 × 4</p>
    <figure>
      <p class="scale-note" id="modelTitle">Area model</p>
      <svg class="model" id="model" viewBox="0 0 640 136" role="img" aria-labelledby="modelTitle"></svg>
      <p class="scale-note" id="scaleNote">Scale labels are the place values. Bar lengths match those values. This is not a unit-square grid.</p>
      <figcaption class="scale-note" id="modelCaption"></figcaption>
      <ul class="parts" id="partList"></ul>
    </figure>
    <form id="answerForm">
      <div class="answer-row">
        <label>Product
          <input id="answer" type="text" inputmode="numeric" autocomplete="off" aria-describedby="feedback">
        </label>
        <button type="submit" id="checkBtn">Check</button>
      </div>
    </form>
    <p class="fb" id="feedback" role="status" aria-live="polite"></p>
    <div class="actions">
      <button type="button" id="nextBtn" hidden>Next question</button>
      <button type="button" class="ghost" id="restartBtn">Restart</button>
    </div>
  </section>

  <section class="panel" id="review" hidden>
    <h2>Final review</h2>
    <p id="finalScore"></p>
    <ol class="review" id="reviewList"></ol>
    <div class="actions">
      <button type="button" id="againBtn">Restart</button>
      <button type="button" class="ghost" id="levelsBtn">Choose another level</button>
    </div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var run = null;

  var setup = document.getElementById("setup");
  var play = document.getElementById("play");
  var review = document.getElementById("review");
  var prompt = document.getElementById("prompt");
  var answer = document.getElementById("answer");
  var checkBtn = document.getElementById("checkBtn");
  var feedback = document.getElementById("feedback");
  var nextBtn = document.getElementById("nextBtn");
  var scoreEl = document.getElementById("score");
  var qNum = document.getElementById("qNum");
  var model = document.getElementById("model");
  var modelCaption = document.getElementById("modelCaption");
  var partList = document.getElementById("partList");
  var scaleNote = document.getElementById("scaleNote");

  function randInt(low, high) {
    return low + Math.floor(Math.random() * (high - low + 1));
  }

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var swap = list[i];
      list[i] = list[j];
      list[j] = swap;
    }
    return list;
  }

  function makeQuestions(level) {
    var questions = [];
    var seen = {};
    if (level === 1) {
      var pairs = [];
      [3, 4, 5, 6, 7, 8, 9].forEach(function (a) {
        for (var b = 1; b <= 9; b++) pairs.push([a, b]);
      });
      shuffle(pairs).slice(0, 10).forEach(function (pair) {
        questions.push({ a: pair[0], b: pair[1] });
      });
      return questions;
    }
    var low = level === 2 ? 10 : 100;
    var high = level === 2 ? 99 : 999;
    var guard = 0;
    while (questions.length < 10 && guard < 5000) {
      guard += 1;
      var a = randInt(low, high);
      var b = randInt(1, 9);
      var key = a + "x" + b;
      if (seen[key]) continue;
      seen[key] = true;
      questions.push({ a: a, b: b });
    }
    if (questions.length !== 10) throw new Error("Could not build 10 questions.");
    return questions;
  }

  function placesOf(n) {
    if (n < 10) return [{ value: n, name: "factor", fill: "#f48fb1" }];
    var chunks = [];
    var hundreds = Math.floor(n / 100) * 100;
    var tens = Math.floor((n % 100) / 10) * 10;
    var ones = n % 10;
    if (hundreds) chunks.push({ value: hundreds, name: "hundreds", fill: "#f48fb1" });
    if (tens) chunks.push({ value: tens, name: "tens", fill: "#ce93d8" });
    if (ones) chunks.push({ value: ones, name: "ones", fill: "#f8bbd0" });
    return chunks;
  }

  function svgEl(name, attrs, text) {
    var node = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (key) { node.setAttribute(key, attrs[key]); });
    if (text != null) node.textContent = text;
    return node;
  }

  function drawModel(item, revealed) {
    while (model.firstChild) model.removeChild(model.firstChild);
    partList.textContent = "";
    var chunks = placesOf(item.a);
    var usable = 560;
    var origin = 56;
    var x = origin;
    var thin = false;
    scaleNote.textContent = "Scale labels are the place values. Bar lengths match those values. This is not a unit-square grid.";
    model.appendChild(svgEl("text", { x: "8", y: "78", "font-size": "22", "font-weight": "700", fill: "#880e4f" }, String(item.b)));
    model.appendChild(svgEl("line", { x1: String(origin), y1: "99", x2: String(origin + usable), y2: "99", stroke: "#333", "stroke-width": "2" }));
    model.appendChild(svgEl("line", { x1: String(origin), y1: "94", x2: String(origin), y2: "104", stroke: "#333", "stroke-width": "1.5" }));
    model.appendChild(svgEl("text", { x: String(origin), y: "24", "font-size": "15", fill: "#555" }, "0"));
    model.appendChild(svgEl("text", { x: String(origin + usable), y: "24", "text-anchor": "end", "font-size": "15", fill: "#555" }, String(item.a)));
    var partials = [];
    chunks.forEach(function (chunk) {
      var w = usable * (chunk.value / item.a);
      if (w < 12) thin = true;
      var partial = chunk.value * item.b;
      partials.push(partial);
      var rectAttrs = {
        class: "part-bar",
        x: String(x),
        y: "40",
        width: String(w),
        height: "52",
        rx: "4",
        fill: chunk.fill,
        stroke: "#880e4f",
        "stroke-width": "1.5",
        "data-place": chunk.name,
        "data-value": String(chunk.value)
      };
      if (revealed) rectAttrs["data-partial"] = String(partial);
      model.appendChild(svgEl("rect", rectAttrs));
      if (w >= 36) {
        model.appendChild(svgEl("text", {
          x: String(x + w / 2),
          y: "72",
          "text-anchor": "middle",
          "font-size": "16",
          "font-weight": "700",
          fill: "#222"
        }, String(chunk.value)));
      }
      x += w;
      model.appendChild(svgEl("line", { x1: String(x), y1: "94", x2: String(x), y2: "104", stroke: "#333", "stroke-width": "1.5" }));
      if (w >= 32) {
        model.appendChild(svgEl("text", {
          x: String(x),
          y: "122",
          "text-anchor": "middle",
          "font-size": "14",
          fill: "#222"
        }, runningLabel(chunks, chunk)));
      }
      var li = document.createElement("li");
      if (revealed) li.textContent = chunk.value + " × " + item.b + " = " + partial + " (" + chunk.name + ")";
      else li.textContent = chunk.name + ": " + chunk.value;
      partList.appendChild(li);
    });
    if (revealed) {
      var sumLine = document.createElement("li");
      sumLine.textContent = partials.join(" + ") + " = " + (item.a * item.b);
      partList.appendChild(sumLine);
      modelCaption.textContent = item.a < 10
        ? "After your try: one rectangle, " + item.a + " × " + item.b + " = " + (item.a * item.b) + "."
        : "After your try: split " + item.a + " by place value, multiply each part by " + item.b + ", then add the partial products." + (thin ? " A small place is a thin sliver on this scale." : "");
    } else if (item.a < 10) {
      modelCaption.textContent = "One rectangle. The side labels are the factors " + item.a + " and " + item.b + ". The product stays hidden until you check.";
    } else {
      modelCaption.textContent = item.a + " is split into place values. Those labels are factors only. Partial products stay hidden until you check." + (thin ? " A small place is a thin sliver on this scale." : "");
    }
  }

  function runningLabel(chunks, chunk) {
    var sum = 0;
    for (var i = 0; i < chunks.length; i++) {
      sum += chunks[i].value;
      if (chunks[i] === chunk) return String(sum);
    }
    return String(chunk.value);
  }

  function current() { return run.questions[run.index]; }

  function showFeedback(kind, text) {
    feedback.className = "fb show " + kind;
    feedback.textContent = text;
  }

  function clearFeedback() {
    feedback.className = "fb";
    feedback.textContent = "";
    answer.classList.remove("bad");
  }

  function renderQuestion() {
    var item = current();
    qNum.textContent = String(run.index + 1);
    scoreEl.textContent = String(run.score);
    prompt.textContent = item.a + " × " + item.b;
    prompt.dataset.a = String(item.a);
    prompt.dataset.b = String(item.b);
    drawModel(item, false);
    answer.value = "";
    answer.disabled = false;
    checkBtn.disabled = false;
    nextBtn.hidden = true;
    clearFeedback();
    answer.focus();
  }

  function start(level) {
    run = {
      level: level,
      questions: makeQuestions(level).map(function (item) {
        return { a: item.a, b: item.b, given: null, correct: false, scored: false };
      }),
      index: 0,
      score: 0
    };
    setup.hidden = true;
    review.hidden = true;
    play.hidden = false;
    renderQuestion();
  }

  function finish() {
    play.hidden = true;
    review.hidden = false;
    var earned = run.score;
    document.getElementById("finalScore").textContent = "Score " + earned + " / 100. Each correct answer earned 10 points.";
    var list = document.getElementById("reviewList");
    list.textContent = "";
    run.questions.forEach(function (item, i) {
      var li = document.createElement("li");
      var product = item.a * item.b;
      var mark = document.createElement("span");
      mark.className = item.correct ? "mark-ok" : "mark-no";
      mark.textContent = item.correct ? "Correct, 10 points. " : "Incorrect, 0 points. ";
      li.appendChild(document.createTextNode((i + 1) + ". " + item.a + " × " + item.b + " = " + product + ". Your answer: " + item.given + ". "));
      li.appendChild(mark);
      list.appendChild(li);
    });
  }

  document.getElementById("setupForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var picked = document.querySelector('input[name="level"]:checked');
    start(Number(picked.value));
  });

  document.getElementById("answerForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!run || run.index >= run.questions.length) return;
    var item = current();
    if (item.scored) return;
    var raw = answer.value.trim();
    if (!/^\d+$/.test(raw)) {
      answer.classList.add("bad");
      showFeedback("bad", "Type a whole number. A blank answer is not scored, and this try is still open.");
      answer.focus();
      return;
    }
    var value = Number(raw);
    var product = item.a * item.b;
    item.scored = true;
    item.given = value;
    item.correct = value === product;
    if (item.correct) run.score += 10;
    scoreEl.textContent = String(run.score);
    answer.disabled = true;
    checkBtn.disabled = true;
    answer.classList.remove("bad");
    drawModel(item, true);
    if (item.correct) showFeedback("good", "Correct. " + item.a + " × " + item.b + " = " + product + ". +10 points.");
    else showFeedback("bad", "Incorrect. " + item.a + " × " + item.b + " = " + product + ". +0 points.");
    nextBtn.hidden = false;
    nextBtn.textContent = run.index === 9 ? "See final review" : "Next question";
    nextBtn.focus();
  });

  nextBtn.addEventListener("click", function () {
    if (!run) return;
    if (run.index === 9) finish();
    else {
      run.index += 1;
      renderQuestion();
    }
  });

  function restart() {
    if (!run) return;
    start(run.level);
  }
  document.getElementById("restartBtn").addEventListener("click", restart);
  document.getElementById("againBtn").addEventListener("click", restart);
  document.getElementById("levelsBtn").addEventListener("click", function () {
    run = null;
    play.hidden = true;
    review.hidden = true;
    setup.hidden = false;
  });

  window.__lunaGame = {
    getState: function () {
      if (!run) return { phase: setup.hidden ? "review" : "setup", score: 0, length: 0 };
      return {
        phase: review.hidden ? "play" : "review",
        level: run.level,
        score: run.score,
        index: run.index,
        length: run.questions.length,
        factors: run.questions.map(function (item) { return [item.a, item.b]; }),
        scored: run.questions.map(function (item) { return item.scored; })
      };
    }
  };
})();
</script>
</body>
</html>
